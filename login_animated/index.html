<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Animated Login</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="box">
      <span class="border-line"></span>

      <form id="loginForm">
        <h2>Login</h2>

        <div class="inputBox">
          <input type="text" required />
          <span>Username</span>
        </div>

        <div class="inputBox">
          <input type="password" required />
          <span>Password</span>
        </div>

        <button type="submit">Sign In</button>
      </form>
    </div>

    <script src="loginj.js"></script>
  </body>
</html>
