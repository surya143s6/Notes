      const h1 = document.getElementById("count");

      let i = 5;

      const pongalWish = new Promise((resolve) => {
        function countdown() {
          if (i >= 0) {
            h1.textContent = i;
            i--;
            setTimeout(countdown, 1000);
          } else {
            resolve("🎉 Happy Pongal 🎉");
          }
        }

        countdown();
      });

      pongalWish.then((message) => {
        h1.textContent = message;
      });
