<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Border</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <style>
        :root {
    
    --fs-base: 1rem;          
    --fs-large: 1.5rem;       
    --space-md: 1.5rem;       
    --border-main: rebeccapurple;
    --border-top: #bfec1f;
    --info-bg: #9cdbfff7;
    --info-border: #0ea7fff7;

   
    --border-width: 0.625rem; 
    --border-left-wide: calc(var(--border-width) + 0.3125rem);
    --radius-lg: 1.875rem;    
    --radius-md: 0.9375rem;   
  }

  body {
    display: grid;
    place-content: center;
    min-height: 100vh;
    font-family: "Roboto", sans-serif;
  }

  .content {
    font-size: var(--fs-large);
    width: calc(25rem); 
    padding: var(--space-md);
    border: var(--border-width) dashed var(--border-main);
    border-top-color: var(--border-top);
    border-left-width: var(--border-left-wide);
    border-radius: var(--radius-lg);
  }

  .info {
    font-size: var(--fs-large);
    width: calc(50rem);
    background: var(--info-bg);
    padding: var(--space-md);
    border-left: var(--border-width) solid var(--info-border);
    border-radius: var(--radius-md);
  }


    </style>
  </head>
  <body>
   

    <div class="info">
      <h4>Intended Audience</h4>
      <p>
        This tutorial assumes that you already have a static React site
        (Gatsby/Next) being deployed on Vercel or Netlify.
      </p>
      <p>
        It's written with the intermediate React developer in mind; if you're
        newer to the modern JS ecosystem, it might be a bit hard to follow.
      </p>
    </div>
  </body>
</html>
