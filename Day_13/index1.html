<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      :root{
        font-size:16px;
        --bg-color:     oklch(0.87 0.08 234.06);
        --pd-padding1: 1rem;
        --border-left:oklch(70.067% 0.17022 243.51);
        --border-type:solid;
        --font-family:Roboto, sans-serif;


      }
      div {
        background: var(--bg-color);
        padding: calc(0.5*var(--pd-padding1));
        border-left: 0.5rem var(--border-type) var(--border-left);
        font-family: var(--font-family);
        border-radius: 12px;
        width: 530px;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-content: center;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div>
      <h3>Intended Audience</h3>
      <p>
        This tutorial assumes that you already have a static React site
        (Gatsby/Next) being deployed on Vercel or Netlify.
      </p>
      <p>
        It's written with the intermediate React developer in mind; if you're
        newer to the modern JS ecosystem, it might be a bit hard to follow.
      </p>
    </div>
  </body>
</html>
