<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      body {
        background: plum;
        margin: 0;
        display: grid;
        min-height: 100vh;
        place-content: center;
      }

      button {
        font-size: 2rem;
      }
    </style>
  </head>
  <body>
    <!-- Event listener - Event - click -->
    <button onclick="start()">▶️</button>
    <button onclick="pause()">⏸️</button>
    <button onclick="stop()">⏹️</button>

    <script>
      const colors = ["crimson", "orange", "teal", "pink", "blue"];

      let colorInterval; // undefined
      let i = 0;

      function pause() {
        console.log("Pausing...");
        clearInterval(colorInterval);
      }

      // Lexical Scope
      function start() {
        console.log("Starting Slideshow ");

        colorInterval = setInterval(() => {
          // Restart when out of bounds
          if (i == colors.length) {
            i = 0;
          }

          console.log(i, colors[i]);
          document.body.style.background = colors[i];
          i++;

          console.log("End", i);
        }, 1000);
      }

      function stop() {
        console.log("Stopping...");
        clearInterval(colorInterval);
        i = 0;
      }

      //   Task -  Every 2s body color must change and then cycle
      //   document.body.setAttribute("style", "background: crimson");
    </script>
  </body>
</html>
